id = "basics/05b_divide_by_zero"
title = "Dividing by zero panics at run time"
difficulty = "beginner"
estimated_minutes = 6
concept = "divide-by-zero"
expected_runtime_panic = "attempt to divide by zero"
solution_outline = """
The code COMPILES — the division looks fine to the compiler. But
`people_at_the_table()` returns 0, and dividing by zero has no answer, so at RUN
time Rust panics with "attempt to divide by zero" instead of inventing a wrong
result. The compiler can't catch it here because the divisor comes from a function
call, not a literal it can see is zero (a literal `24 / 0` WOULD be rejected at
compile time). The fix is to never divide by a value that might be zero: guard it
first — `if people == 0 { println!("no one is here yet"); } else { println!("each
person gets {} cookies", cookies / people); }` — or reach for
`cookies.checked_div(people)`, which returns `None` on a zero divisor instead of
panicking, so you handle the empty case explicitly.
"""

[[book_refs]]
chapter = "ch03-02-data-types"
anchor = "numeric-operations"
why = "The Book's numeric-operations section covers integer division; this exercise shows what that division does when the divisor turns out to be zero at run time."
