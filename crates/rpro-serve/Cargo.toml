[package]
name = "rpro-serve"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Tempered Studio local web server — serves the gui/ shell and runs the current exercise in a browser with zero native UI deps. Loopback-only, op-whitelisted."

[[bin]]
name = "rpro-serve"
path = "src/main.rs"

[dependencies]
rpro-state = { path = "../rpro-state" }
rpro-storage-fs = { path = "../rpro-storage-fs" }
rpro-lang = { path = "../rpro-lang" }
rpro-lang-rust = { path = "../languages/rust" }
rpro-lsp = { path = "../rpro-lsp" }
rpro-core = { path = "../rpro-core" }
rpro-toolchain-local = { path = "../rpro-toolchain-local" }
rpro-runner = { path = "../rpro-runner" }
rpro-book = { path = "../rpro-book" }
rpro-glossary = { path = "../rpro-glossary" }

serde = { workspace = true }
serde_json = { workspace = true }
pollster = { workspace = true }

axum = "0.7.9"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net"] }
# compression-gzip: the single-file gui shell is ~164 KB of HTML/JS — it was
# shipped UNCOMPRESSED on every load. gzip cuts it ~4×; JSON similarly. (No
# brotli: flate2 is light and permissive, and gzip captures most of the win.)
tower-http = { version = "0.6", features = ["fs", "compression-gzip"] }

[lints]
workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = { workspace = true }
