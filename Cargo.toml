[workspace]
resolver = "2"
members = [
    "crates/rpro-lang",
    "crates/languages/rust",
    "crates/rpro-toolchain-local",
    "crates/rpro-state",
    "crates/rpro-runner",
    "crates/rpro-book",
    "crates/rpro-tui",
    "crates/rpro-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thepictishbeast/Patina"
authors = ["PlausiDen LLC"]

[workspace.dependencies]
# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
toml = "0.8"
anyhow = "1"
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
console = "0.15"

# TUI
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
pulldown-cmark = "0.12"

# Misc
walkdir = "2"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
