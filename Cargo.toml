[workspace]
resolver = "2"
members = [
    "crates/rpro-lang",
    "crates/languages/rust",
    "crates/rpro-core",
    "crates/rpro-toolchain-local",
    "crates/rpro-storage-fs",
    "crates/rpro-state",
    "crates/rpro-runner",
    "crates/rpro-book",
    "crates/rpro-glossary",
    "crates/rpro-lsp",
    "crates/rpro-tui",
    "crates/rpro-cli",
    "crates/rpro-serve",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thepictishbeast/Patina"
authors = ["PlausiDen LLC"]

[workspace.dependencies]
# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
toml = "0.8"
anyhow = "1"
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
console = "0.15"

# TUI
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
pulldown-cmark = "0.12"

# Misc
walkdir = "2"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
pollster = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# nursery is off the gate ON PURPOSE: it's officially unstable / false-positive-
# prone (the clippy book advises against gating CI on it). Here it fires
# `future_not_send` on `Core`'s async methods that await through
# `Box<dyn Toolchain/Storage>` — but `Core` is wasm-safe, single-threaded, and
# loopback-only, so those futures are never sent across threads = false positive.
# `pedantic` stays the bar.
nursery = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# `similar_names` flags pairs like `core`/`code` and `t`/`theme` — short locals
# that are distinct in context; the warning is noise here.
similar_names = "allow"
# the TUI `render_*` fns are long by nature (one widget tree each); splitting
# them to satisfy `too_many_lines` hurts readability more than it helps.
too_many_lines = "allow"
