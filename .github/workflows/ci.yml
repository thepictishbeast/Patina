name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: [self-hosted, linux, x64, plausiden]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: [self-hosted, linux, x64, plausiden]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked

  test:
    name: test
    runs-on: [self-hosted, linux, x64, plausiden]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked

  doc:
    name: doc
    runs-on: [self-hosted, linux, x64, plausiden]
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --no-deps --locked

  smoke:
    name: e2e smoke
    runs-on: [self-hosted, linux, x64, plausiden]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Builds rpro-serve, seeds a throwaway store, serves on loopback, and
      # asserts the API + serving contract (no-leak, body limit, hint gating,
      # real run). Deps beyond the toolchain: python3 + curl (standard on linux).
      - run: bash scripts/smoke.sh

  curriculum:
    name: exercise integrity
    runs-on: [self-hosted, linux, x64, plausiden]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Compiles every exercise and asserts it emits the error code its .toml
      # claims to teach — the curriculum's central invariant. Catches an edited
      # exercise that no longer fails, a typo'd code, or a toolchain code shift.
      - run: bash scripts/verify-exercises.sh

  cli-smoke:
    name: cli smoke
    runs-on: [self-hosted, linux, x64, plausiden]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Drives the real `rpro` binary against an isolated store (RPRO_STORE):
      # init seeding, exercise list, by-hand check, explain, progress.
      - run: bash scripts/smoke-cli.sh

  gui-test:
    name: gui transforms
    runs-on: [self-hosted, linux, x64, plausiden]
    steps:
      - uses: actions/checkout@v4
      # Pulls the pure transforms out of gui/index.html (esc→mdToHtml,
      # highlightRust) and pins their contract — most importantly the
      # highlighter's XSS-safety invariant (strip the spans → the input). No
      # browser needed; just node (preinstalled on the runner).
      - run: node scripts/test-gui.mjs
