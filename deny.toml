# cargo-deny — supply-chain policy for Tempered Studio (SECURITY.md §4 / #21).
#
# Run locally:  cargo deny check
# In CI:        the `cargo-deny` job in .github/workflows/ci.yml (uses the
#               maintained EmbarkStudios/cargo-deny-action, no local compile).
#
# Covers four axes: security advisories, license compliance, banned/duplicate
# crates, and crate sources. FOSS-first: permissive licenses only, crates.io only.

[advisories]
# RustSec advisory DB. Modern cargo-deny denies vulnerable + unsound crates by
# default; yanked releases are denied here too. (Complements the local
# `cargo audit`, which is currently clean: 0 vulns / 236 deps.)
yanked = "deny"

[licenses]
# The allow-list was derived from `cargo metadata` over the ACTUAL dependency
# tree, so it covers exactly what ships — overwhelmingly MIT / Apache-2.0, with a
# few AND-clauses that pull in Unicode-3.0, BSD-3-Clause, and Zlib, plus one
# file-level-copyleft MPL-2.0 dependency (fine to consume — it doesn't infect the
# workspace, which is MIT). ISC / BSD-2-Clause / Unicode-DFS-2016 / Unlicense are
# permissive headroom for future deps.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "Unlicense",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are bloat/drift, not a hard error; wildcard deps are banned
# (they make the lockfile non-reproducible). Internal `{ path = ... }` deps are
# exempt via allow-wildcard-paths: every workspace crate is `publish = false`
# (unpublished — distribution is GitHub releases, not crates.io), and cargo-deny
# only honours the exemption for unpublished crates, so a real registry wildcard
# (`version = "*"`) still fails the gate.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Supply-chain integrity: only the official crates.io registry, no unvetted git
# or alternate registries.
unknown-registry = "deny"
unknown-git = "deny"
