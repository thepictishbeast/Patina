name: release

# Build the installable desktop packages and attach them to a GitHub Release.
# Triggered by a version tag (e.g. `v0.1.0`). See docs/DISTRIBUTION.md for the
# full plan; this workflow covers the Linux desktop artifacts that are buildable
# today (the `rpro` CLI/TUI): .deb, .rpm, and a no-root AppImage. The *GUI*
# AppImage (bundling rpro-serve) waits on rpro-serve becoming relocatable — see
# docs/BACKLOG.md. APK lives in the mobile repo; the web bundle deploys from its
# own workflow.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build packages for'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-packages:
    name: .deb + .rpm (x86_64)
    runs-on: [self-hosted, linux, x64, plausiden]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # cargo install is a no-op when the right version is already present, so
      # this is cheap on warm runners and self-healing on cold ones.
      - name: install packaging tools
        run: |
          cargo install cargo-deb --version ^3 --locked || cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked

      - name: build release binary
        run: cargo build --release --locked -p rpro-cli

      - name: build .deb
        run: cargo deb -p rpro-cli --no-build

      - name: build .rpm
        run: cargo generate-rpm -p crates/rpro-cli

      - name: collect artifacts + checksums
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/
          # Supply-chain integrity for direct GH-Release downloads / Obtainium:
          # a checksum file users can verify against (sha256sum -c SHA256SUMS).
          ( cd dist && sha256sum *.deb *.rpm > SHA256SUMS )
          ls -lh dist/
          cat dist/SHA256SUMS

      - name: upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Create the release if the tag push didn't already, then attach the
          # packages (clobber so re-runs replace stale assets).
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/*.deb dist/*.rpm dist/SHA256SUMS --clobber

  appimage:
    name: AppImage (x86_64)
    runs-on: [self-hosted, linux, x64, plausiden]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Builds the release `rpro`, assembles the AppDir from packaging/appimage/,
      # fetches appimagetool, and packs (FUSE, or extract-and-run fallback).
      # UPDATE_INFO embeds AppImageUpdate/zsync delta self-update info + emits the
      # .zsync sidecar that lives next to the release asset (DISTRIBUTION.md).
      - name: build AppImage (+ .zsync update metadata)
        env:
          ARCH: x86_64
          UPDATE_INFO: "gh-releases-zsync|thepictishbeast|Tempered-Studio|latest|Tempered_Studio-x86_64.AppImage.zsync"
        run: bash scripts/build-appimage.sh dist

      - name: checksum
        run: ( cd dist && sha256sum Tempered_Studio-*.AppImage > SHA256SUMS.appimage && cat SHA256SUMS.appimage )

      - name: upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          # The .zsync (if produced) is what AppImageUpdate polls for delta updates.
          gh release upload "$TAG" dist/Tempered_Studio-*.AppImage dist/SHA256SUMS.appimage --clobber
          [ -f dist/Tempered_Studio-x86_64.AppImage.zsync ] \
            && gh release upload "$TAG" dist/Tempered_Studio-x86_64.AppImage.zsync --clobber || true
